name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run; main is never cancelled so every
# merged commit keeps a conclusive result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `npm test` runs node --experimental-strip-types, which needs Node 22+.
          node-version: '22'
          cache: npm

      - run: npm ci

      # worker-configuration.d.ts is generated and gitignored. Without this step tsc aborts on
      # "Cannot find type definition file" BEFORE reaching any real check — a green-looking run
      # that verified nothing.
      - name: Generate Worker types
        run: npm run cf-typegen

      - name: Typecheck
        run: npx tsc -b

      - name: Tests
        run: npm test
