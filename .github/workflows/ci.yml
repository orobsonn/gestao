name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run; main is never cancelled so every
# merged commit keeps a conclusive result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    # Pin the status-check name so a future rename of the job id cannot silently detach a branch
    # protection rule that requires it.
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `npm test` runs node --experimental-strip-types, which needs Node 22+.
          node-version: '22'
          cache: npm

      - run: npm ci

      # worker-configuration.d.ts is generated and gitignored. Without this step tsc aborts on
      # "Cannot find type definition file" BEFORE reaching any real check — a green-looking run
      # that verified nothing.
      - name: Generate Worker types
        run: npm run cf-typegen

      - name: Typecheck
        run: npx tsc -b

      - name: Tests
        # `node --test` exits 0 when it discovers ZERO files — a green run that verified nothing.
        # The floor is a discovery tripwire, not a coverage target: it only has to be far below the
        # real count and far above zero.
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          passed=$(sed -n 's/^# pass \([0-9]\+\)$/\1/p' test-output.txt | tail -1)
          if [ -z "$passed" ] || [ "$passed" -lt 200 ]; then
            echo "::error::test discovery looks broken — only '${passed:-none}' tests passed"
            exit 1
          fi
